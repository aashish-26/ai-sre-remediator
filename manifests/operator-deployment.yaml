apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-operator
  namespace: default
  labels:
    app: ai-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-operator
  template:
    metadata:
      labels:
        app: ai-operator
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      serviceAccountName: ai-operator-sa
      containers:
      - name: ai-operator
        # Replace image with your built operator image if needed
        image: ai-operator:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: metrics
          containerPort: 9100
        - name: webhook
          containerPort: 5001
        env:
        - name: METRICS_PORT
          value: "9100"
        - name: WEBHOOK_PORT
          value: "5001"
        readinessProbe:
          tcpSocket:
            port: 9100
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 9100
          initialDelaySeconds: 30
          periodSeconds: 20

