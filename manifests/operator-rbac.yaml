apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-operator-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-operator-role
  namespace: default
rules:
- apiGroups: [ "" ]
  resources: [ "pods", "services", "endpoints", "configmaps", "events" ]
  verbs: [ "get", "list", "watch", "create", "update", "patch", "delete" ]
- apiGroups: [ "apps" ]
  resources: [ "deployments", "replicasets" ]
  verbs: [ "get", "list", "watch", "create", "update", "patch", "delete" ]
- apiGroups: [ "ai-sre.example.com" ]
  resources: [ "incidentremediations" ]
  verbs: [ "get", "list", "watch", "create", "update", "patch", "delete" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-operator-rb
  namespace: default
subjects:
- kind: ServiceAccount
  name: ai-operator-sa
  namespace: default
roleRef:
  kind: Role
  name: ai-operator-role
  apiGroup: rbac.authorization.k8s.io
